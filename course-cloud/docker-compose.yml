version: '3.8'

networks:
  course-network:
    driver: bridge

volumes:
  user-data:
  catalog-data:
  enrollment-data:
  nacos-data:
  nacos-logs:

services:
  # ========== Nacos 服务注册中心 ==========
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nacos
    environment:
      - MODE=standalone
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "8080:8080"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    networks:
      - course-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 20s
      timeout: 15s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  # ========== user-db（参考旧版本，简化配置，修复健康检查） ==========
  user-db:
    image: mysql:8.4
    container_name: user-db
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: user_db
      MYSQL_USER: user_user
      MYSQL_PASSWORD: user_pass
      # 关键：增加初始化超时配置，避免数据库启动不完整
      MYSQL_INITDB_SKIP_TZINFO: "1"
    ports:
      - "3306:3306"
    volumes:
      - user-data:/var/lib/mysql
    networks:
      - course-network
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 移除可能冲突的认证插件配置，用MySQL 8默认的caching_sha2_password
    healthcheck:
      # 修复：用root用户做健康检查（权限更高，避免普通用户连不上的问题）
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s  # 缩短检查间隔，快速确认数据库就绪
      timeout: 3s
      retries: 10
      start_period: 60s  # 延长启动等待时间，确保数据库完全初始化
    restart: unless-stopped

  # ========== catalog-db（同user-db配置） ==========
  catalog-db:
    image: mysql:8.4
    container_name: catalog-db
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: catalog_db
      MYSQL_USER: catalog_user
      MYSQL_PASSWORD: catalog_pass
      MYSQL_INITDB_SKIP_TZINFO: "1"
    ports:
      - "3307:3306"
    volumes:
      - catalog-data:/var/lib/mysql
    networks:
      - course-network
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ========== enrollment-db（同user-db配置） ==========
  enrollment-db:
    image: mysql:8.4
    container_name: enrollment-db
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: enrollment_db
      MYSQL_USER: enrollment_user
      MYSQL_PASSWORD: enrollment_pass
      MYSQL_INITDB_SKIP_TZINFO: "1"
    ports:
      - "3308:3306"
    volumes:
      - enrollment-data:/var/lib/mysql
    networks:
      - course-network
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ========== user-service 公共配置 ==========
  user-service-common:
    build:
      context: ./user-service
      dockerfile: Dockerfile
      cache_from:  # 复用已有镜像，不重新build
        - course-cloud-user-service:1.1.0
    image: course-cloud-user-service:1.1.0
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 关键：增加数据库连接超时和重试配置，适配数据库启动节奏
      SPRING_DATASOURCE_URL: jdbc:mysql://user-db:3306/user_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true
      SPRING_DATASOURCE_USERNAME: user_user
      SPRING_DATASOURCE_PASSWORD: user_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      # 改回 create-drop：确保每次启动都重新建表（适合测试环境）
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_JPA_SHOW_SQL: true
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: true
      SPRING_JPA_PROPERTIES_HIBERNATE_HBM2DDL_IMPORT_FILES_SQL_EXTRACTOR: org.hibernate.tool.hbm2ddl.MultipleLinesSqlCommandExtractor
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQL8Dialect
      SERVER_PORT: 8081
      SPRING_APPLICATION_NAME: user-service
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: dev
      SPRING_CLOUD_NACOS_DISCOVERY_GROUP: COURSEHUB_GROUP
      SPRING_CLOUD_NACOS_DISCOVERY_EPHEMERAL: true
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_ORG_HIBERNATE_DDL: DEBUG  # 打印建表日志，方便排查
    depends_on:
      user-db:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - course-network
    restart: unless-stopped

  # ========== user-service 多实例 ==========
  user-service-1:
    extends:
      service: user-service-common
    container_name: user-service-1
    ports:
      - "8081:8081"

  user-service-2:
    extends:
      service: user-service-common
    container_name: user-service-2
    ports:
      - "8084:8081"

  user-service-3:
    extends:
      service: user-service-common
    container_name: user-service-3
    ports:
      - "8085:8081"

  # ========== catalog-service 公共配置 ==========
  catalog-service-common:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
      cache_from:
        - course-cloud-catalog-service:1.1.0
    image: course-cloud-catalog-service:1.1.0
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://catalog-db:3306/catalog_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true
      SPRING_DATASOURCE_USERNAME: catalog_user
      SPRING_DATASOURCE_PASSWORD: catalog_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_JPA_SHOW_SQL: true
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: true
      SPRING_JPA_PROPERTIES_HIBERNATE_HBM2DDL_IMPORT_FILES_SQL_EXTRACTOR: org.hibernate.tool.hbm2ddl.MultipleLinesSqlCommandExtractor
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQL8Dialect
      SERVER_PORT: 8082
      SPRING_APPLICATION_NAME: catalog-service
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: dev
      SPRING_CLOUD_NACOS_DISCOVERY_GROUP: COURSEHUB_GROUP
      SPRING_CLOUD_NACOS_DISCOVERY_EPHEMERAL: true
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_ORG_HIBERNATE_DDL: DEBUG
    depends_on:
      catalog-db:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - course-network
    restart: unless-stopped

  # ========== catalog-service 多实例 ==========
  catalog-service-1:
    extends:
      service: catalog-service-common
    container_name: catalog-service-1
    ports:
      - "8082:8082"

  catalog-service-2:
    extends:
      service: catalog-service-common
    container_name: catalog-service-2
    ports:
      - "8086:8082"

  catalog-service-3:
    extends:
      service: catalog-service-common
    container_name: catalog-service-3
    ports:
      - "8087:8082"

  # ========== 选课服务 ==========
  enrollment-service:
    build:
      context: ./enrollment-service
      dockerfile: Dockerfile
      cache_from:
        - course-cloud-enrollment-service:1.1.0
    image: course-cloud-enrollment-service:1.1.0
    container_name: enrollment-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://enrollment-db:3306/enrollment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true
      SPRING_DATASOURCE_USERNAME: enrollment_user
      SPRING_DATASOURCE_PASSWORD: enrollment_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_JPA_SHOW_SQL: true
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: true
      SPRING_JPA_PROPERTIES_HIBERNATE_HBM2DDL_IMPORT_FILES_SQL_EXTRACTOR: org.hibernate.tool.hbm2ddl.MultipleLinesSqlCommandExtractor
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQL8Dialect
      SERVER_PORT: 8083
      SPRING_APPLICATION_NAME: enrollment-service
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: dev
      SPRING_CLOUD_NACOS_DISCOVERY_GROUP: COURSEHUB_GROUP
      SPRING_CLOUD_NACOS_DISCOVERY_EPHEMERAL: true
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_ORG_HIBERNATE_DDL: DEBUG
    ports:
      - "8083:8083"
    depends_on:
      enrollment-db:
        condition: service_healthy
      user-service-1:
        condition: service_started
      catalog-service-1:
        condition: service_started
      nacos:
        condition: service_healthy
    networks:
      - course-network
    restart: unless-stopped

